<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>iGCU北大秋日打卡图</title>
<style>
:root{--ink:#293b32;--muted:#7a887e;--paper:#faf9f4;--green:#47765c;--line:#e0e7de;--coral:#df8068}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{padding:22px clamp(15px,3vw,34px) 15px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--green);margin:0 0 7px}h1{font-size:clamp(26px,4vw,38px);letter-spacing:-.04em;margin:0;font-weight:700}.subtitle{font-size:14px;color:var(--muted);margin:7px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--green);border-radius:999px;padding:10px 14px;font-size:13px;font-weight:650}button:hover{filter:brightness(.97)}button.primary{background:var(--green);color:#fff;border-color:var(--green)}button.danger{color:#b85d4a}
.hintbar{margin:0 18px 12px;padding:10px 14px;border-radius:12px;background:#edf3e9;color:#526d59;font-size:12px;line-height:1.6}
#map{width:calc(100% - 30px);aspect-ratio:2048 / 1457;height:auto;margin:0 15px 12px;position:relative;overflow:hidden;border:1px solid #e1e6dd;border-radius:17px;background:#e8eee7;cursor:grab;touch-action:none}#map.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;will-change:transform}#campus{width:100%;height:100%;display:block;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;transform:translate(-50%,-100%);background:transparent;border:0;padding:0;display:flex;align-items:center;flex-direction:column;gap:4px;z-index:3;filter:drop-shadow(0 2px 2px #0002)}.pin-dot{width:29px;height:29px;border-radius:50% 50% 50% 8px;transform:rotate(-45deg);background:var(--pin-color,var(--green));border:2px solid white;display:grid;place-items:center;color:white;font-size:12px}.pin-dot span{transform:rotate(45deg)}.pin-label{background:#fffdf7;border:1px solid #e1e7de;border-radius:8px;padding:4px 7px;font-size:11px;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}.pin.active .pin-dot{box-shadow:0 0 0 3px #fff9,0 0 0 5px var(--pin-color,var(--green))}
.controls{position:absolute;right:12px;top:12px;z-index:10;display:flex;flex-direction:column;gap:6px}.controls button{width:38px;height:38px;padding:0;border-radius:12px;font-size:20px;box-shadow:0 2px 9px #0001}
.map-tip{position:absolute;left:12px;bottom:12px;background:#ffffffed;border-radius:10px;padding:8px 11px;color:#68776d;font-size:11px;z-index:8;pointer-events:none}
footer{padding:0 20px 17px;color:#9aa199;font-size:11px}
.popup{display:none;position:fixed;z-index:120;left:50vw;top:50vh;transform:translate(-50%,-50%);width:min(340px,calc(100vw - 28px));max-height:calc(100vh - 28px);max-height:calc(100dvh - 28px);overflow:auto;background:#fffdf8;border:1px solid #e7e9df;border-radius:18px;padding:17px;box-shadow:0 12px 38px #26372d30}.popup.open{display:block}.popup-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;cursor:move;touch-action:none;user-select:none}.popup-top button{cursor:pointer;touch-action:manipulation}.popup h2{font-size:19px;margin:0 0 7px}.popup p{font-size:13px;line-height:1.65;color:#66746a;white-space:pre-wrap;margin:0 0 10px}.popup img{width:100%;max-height:220px;object-fit:contain;border-radius:11px;background:#f0f1ec}.popup-actions{display:flex;gap:7px;margin-top:12px}
.backdrop{display:none;position:fixed;inset:0;z-index:100;background:#1c2a2270;align-items:center;justify-content:center;padding:14px}.backdrop.open{display:flex}.dialog{background:#fffdf8;width:min(100%,460px);max-height:92vh;overflow:auto;border-radius:20px;padding:21px;box-shadow:0 16px 50px #0002}.dialog h2{font-size:22px;margin:0 0 5px}.dialog .intro{font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 12px}.dialog label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}.dialog input[type=text],.dialog input[type=file],.dialog textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:14px;color:var(--ink)}.dialog textarea{min-height:80px;resize:vertical}.dialog small{display:block;color:var(--muted);font-size:11px;line-height:1.5;margin-top:5px}.dialog img{display:none;max-width:100%;max-height:180px;object-fit:contain;border-radius:10px;margin-top:8px}.dialog-actions{display:flex;justify-content:space-between;gap:8px;margin-top:18px}.right{display:flex;gap:8px}
@media(max-width:600px){header{padding:18px 13px 12px;align-items:flex-start}.actions{gap:6px}.actions button{font-size:12px;padding:9px 11px}#map{width:calc(100% - 16px);margin:0 8px 10px;border-radius:13px}.hintbar{margin:0 10px 10px}footer{padding:0 14px 14px}}
</style>
</head>
<body>
<header><div><p class="eyebrow">OUR LITTLE CAMPUS ATLAS ✿</p><h1>iGCU北大秋日打卡图</h1><p class="subtitle">把秋日的照片放进地图里，把我们的校园记忆留下来。</p></div>
<div class="actions"><button id="addBtn" class="primary">＋ 标记地点</button><button id="exportBtn">导出备份</button><button id="importBtn">导入备份</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></header>
<div class="hintbar" id="hintbar">点击「标记地点」，再点击地图选择位置；上传照片、写一句回忆，保存就好 ✨</div>
<div id="map" aria-label="可拖动缩放的北大校园记忆地图"><div id="world"><img id="campus" src="pku-campus-map.jpg" alt="北京大学校园地图"><div id="pins"></div></div>
<div class="controls"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="reset" aria-label="重置视图">⌂</button></div><div class="map-tip" id="mapTip">拖动浏览 · 滚轮或按钮缩放</div>
<div class="popup" id="popup"><div class="popup-top"><h2 id="popupName"></h2><button id="closePopup" aria-label="关闭">×</button></div><p id="popupDesc"></p><img id="popupPhoto" alt="地点照片"><div id="noPhoto" style="font-size:12px;color:#849087;display:none">这份记忆还没有照片～</div><div class="popup-actions"><button id="editBtn">编辑</button><button id="deleteBtn" class="danger">删除</button></div></div></div>
<footer>一起收集，最后一起发布 ✨</footer>
<div class="backdrop" id="backdrop"><section class="dialog"><h2 id="formTitle">添加一个地点</h2><p class="intro">给这个地点起个名字，上传照片，再写一句回忆吧。</p><form id="form"><label for="placeName">地点名称 *</label><input id="placeName" type="text" maxlength="80" required placeholder="比如：未名湖边、宿舍楼下"><label for="photoInput">上传照片</label><input id="photoInput" type="file" accept="image/*"><img id="preview" alt="照片预览"><small>照片会自动压缩后保存在当前浏览器。建议选择清晰但不过大的图片。</small><label for="description">写一句记忆（选填）</label><textarea id="description" maxlength="2000" placeholder="那天发生了什么？或者只是想留下一句话……"></textarea><small id="posHint"></small><div class="dialog-actions"><button type="button" id="cancelBtn">取消</button><div class="right"><button type="button" id="deleteInForm" class="danger" style="display:none">删除</button><button class="primary" type="submit">保存地点</button></div></div></form></section></div>
<script>
const map=document.getElementById('map'),world=document.getElementById('world'),pins=document.getElementById('pins');
const STORE='igcu-pku-autumn-checkin-v2';
const COLORS=['#C6533B','#E28A32','#D2A62D','#718B55','#477A69','#5279A5','#8A6BA8','#B65D7A','#8B654A','#D16F55'];
const initial=[
{id:'sample-1',name:'西侧门（内侧）',x:19.5,y:43.5,photo:'',description:'第一份校园记忆 ✌️'},
{id:'sample-2',name:'国际关系学院',x:34,y:43,photo:'',description:'在这里留下我们的故事 ✌️'},
{id:'sample-3',name:'博雅塔',x:60,y:40,photo:'',description:'想起博雅塔的时候 ✌️'}];
let places;try{const s=localStorage.getItem(STORE);places=s?JSON.parse(s):initial;if(!Array.isArray(places))places=initial}catch(e){places=initial}
places=places.map((p,i)=>({...p,color:p.color||COLORS[i%COLORS.length]}));
let scale=1,tx=0,ty=0,drag=null,adding=false,editingId=null,pendingXY=null,pendingPhoto=null,activeId=null,dragMoved=false;
function persist(){try{localStorage.setItem(STORE,JSON.stringify(places));return true}catch(e){alert('浏览器存储空间可能不足。请尝试较小的照片，或先导出备份。');return false}}
function transform(){world.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function zoom(f,cx=map.clientWidth/2,cy=map.clientHeight/2){const old=scale;scale=Math.max(1,Math.min(5,scale*f));const r=scale/old;tx=cx-(cx-tx)*r;ty=cy-(cy-ty)*r;transform()}
function draw(){pins.innerHTML='';places.forEach((p,i)=>{const b=document.createElement('button');b.className='pin'+(p.id===activeId?' active':'');b.style.left=p.x+'%';b.style.top=p.y+'%';b.style.setProperty('--pin-color',p.color||COLORS[i%COLORS.length]);b.innerHTML=`<span class="pin-dot"><span>${i+1}</span></span><span class="pin-label">${esc(p.name)}</span>`;b.title=p.name;b.addEventListener('click',e=>{e.stopPropagation();activeId=p.id;draw();showPopup(p)});pins.appendChild(b)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showPopup(p){const popup=document.getElementById('popup');popup.style.left='50vw';popup.style.top='50vh';popup.style.transform='translate(-50%,-50%)';document.getElementById('popupName').textContent=p.name;document.getElementById('popupDesc').textContent=p.description||'';const im=document.getElementById('popupPhoto'),no=document.getElementById('noPhoto');im.onerror=()=>{im.style.display='none';no.style.display='block'};if(p.photo){im.src=p.photo;im.style.display='block';no.style.display='none'}else{im.removeAttribute('src');im.style.display='none';no.style.display='block'}document.getElementById('popup').classList.add('open')}
function hidePopup(){document.getElementById('popup').classList.remove('open')}
function openForm(id=null,xy=null){editingId=id;pendingXY=xy;pendingPhoto=null;const p=id?places.find(v=>v.id===id):null;document.getElementById('formTitle').textContent=p?'编辑这份记忆':'添加一个地点';document.getElementById('placeName').value=p?.name||'';document.getElementById('description').value=p?.description||'';const im=document.getElementById('preview');if(p?.photo){im.src=p.photo;im.style.display='block'}else{im.removeAttribute('src');im.style.display='none'}document.getElementById('photoInput').value='';document.getElementById('posHint').textContent=p?`位置：${p.x.toFixed(1)}%, ${p.y.toFixed(1)}%`:`位置：${xy.x.toFixed(1)}%, ${xy.y.toFixed(1)}%`;document.getElementById('deleteInForm').style.display=p?'inline-block':'none';document.getElementById('backdrop').classList.add('open')}
function closeForm(){document.getElementById('backdrop').classList.remove('open');editingId=null;pendingXY=null;pendingPhoto=null}
function compress(file){return new Promise((resolve,reject)=>{const rd=new FileReader();rd.onerror=reject;rd.onload=()=>{const im=new Image();im.onerror=reject;im.onload=()=>{const ratio=Math.min(1,1300/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))};im.src=rd.result};rd.readAsDataURL(file)})}
document.getElementById('photoInput').addEventListener('change',async e=>{const f=e.target.files?.[0];if(!f)return;try{pendingPhoto=await compress(f);const im=document.getElementById('preview');im.src=pendingPhoto;im.style.display='block'}catch(err){alert('这张图片读取失败，请换一张试试。')}});
document.getElementById('addBtn').onclick=()=>{adding=!adding;document.getElementById('addBtn').textContent=adding?'取消标记':'＋ 标记地点';document.getElementById('addBtn').classList.toggle('primary',!adding);document.getElementById('mapTip').textContent=adding?'点击地图上想标记的位置':'拖动浏览 · 滚轮或按钮缩放';document.getElementById('hintbar').textContent=adding?'现在点击地图上你想放标记的位置。':'点击「标记地点」，再点击地图选择位置；上传照片、写一句回忆，保存就好 ✨'};
map.addEventListener('click',e=>{if(!adding||dragMoved||e.target.closest('button')||e.target.closest('.popup'))return;const r=world.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;if(x>=0&&x<=100&&y>=0&&y<=100){adding=false;document.getElementById('addBtn').textContent='＋ 标记地点';document.getElementById('addBtn').classList.add('primary');openForm(null,{x,y})}});
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('placeName').value.trim();if(!name)return;const old=editingId?places.find(p=>p.id===editingId):null;const p={id:editingId||'memory-'+Date.now(),name,x:old?old.x:pendingXY.x,y:old?old.y:pendingXY.y,color:old?.color||COLORS[places.length%COLORS.length],photo:pendingPhoto||old?.photo||'',description:document.getElementById('description').value.trim()};if(editingId)places=places.map(v=>v.id===editingId?p:v);else places.push(p);if(persist()){activeId=p.id;draw();closeForm();showPopup(p)}});
document.getElementById('cancelBtn').onclick=closeForm;document.getElementById('backdrop').addEventListener('click',e=>{if(e.target.id==='backdrop')closeForm()});
document.getElementById('editBtn').onclick=()=>{const id=activeId;hidePopup();openForm(id)};
function deleteActive(){const p=places.find(v=>v.id===activeId);if(p&&confirm(`确定删除「${p.name}」吗？`)){places=places.filter(v=>v.id!==activeId);persist();activeId=null;draw();hidePopup()}}
document.getElementById('deleteBtn').onclick=deleteActive;document.getElementById('deleteInForm').onclick=()=>{const id=editingId;if(id&&confirm('确定删除这份记忆吗？')){places=places.filter(v=>v.id!==id);persist();activeId=null;draw();closeForm();hidePopup()}};
// 地点详情弹窗独立于地图显示，并可通过顶部标题栏拖动。
const popup=document.getElementById('popup'),popupTop=popup.querySelector('.popup-top');let popupDrag=null;
popupTop.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const r=popup.getBoundingClientRect();popupDrag={x:e.clientX,y:e.clientY,left:r.left,top:r.top};popup.style.transform='none';popupTop.setPointerCapture?.(e.pointerId);e.preventDefault()});
popupTop.addEventListener('pointermove',e=>{if(!popupDrag)return;const w=popup.offsetWidth,h=popup.offsetHeight;let left=popupDrag.left+e.clientX-popupDrag.x,top=popupDrag.top+e.clientY-popupDrag.y;left=Math.max(8,Math.min(window.innerWidth-w-8,left));top=Math.max(8,Math.min(window.innerHeight-h-8,top));popup.style.left=left+'px';popup.style.top=top+'px'});
function stopPopupDrag(){popupDrag=null}popupTop.addEventListener('pointerup',stopPopupDrag);popupTop.addEventListener('pointercancel',stopPopupDrag);window.addEventListener('resize',()=>{if(!popup.classList.contains('open'))return;const r=popup.getBoundingClientRect();popup.style.left=Math.max(8,Math.min(window.innerWidth-r.width-8,r.left))+'px';popup.style.top=Math.max(8,Math.min(window.innerHeight-r.height-8,r.top))+'px'});
document.getElementById('closePopup').onclick=hidePopup;document.getElementById('zoomIn').onclick=()=>zoom(1.25);document.getElementById('zoomOut').onclick=()=>zoom(.8);document.getElementById('reset').onclick=()=>{scale=1;tx=0;ty=0;transform();hidePopup()};
map.addEventListener('wheel',e=>{e.preventDefault();const r=map.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});
map.addEventListener('pointerdown',e=>{if(e.target.closest('button')||e.target.closest('.popup'))return;drag={x:e.clientX,y:e.clientY,tx,ty,moved:false};map.setPointerCapture(e.pointerId);map.classList.add('dragging')});
map.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;tx=drag.tx+dx;ty=drag.ty+dy;transform()});
map.addEventListener('pointerup',()=>{if(drag){dragMoved=drag.moved;setTimeout(()=>dragMoved=false,0);drag=null;map.classList.remove('dragging')}});map.addEventListener('pointercancel',()=>{drag=null;map.classList.remove('dragging')});
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({format:'pku-memory-map-v1',places},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='igcu-pku-autumn-checkin-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text()),arr=Array.isArray(d)?d:d.places;if(!Array.isArray(arr))throw Error();places=arr.map((p,i)=>({id:p.id||'import-'+i,name:String(p.name||'未命名地点'),x:Number(p.x)||0,y:Number(p.y)||0,color:p.color||COLORS[i%COLORS.length],photo:p.photo||'',description:p.description||''}));if(persist()){draw();alert('备份导入成功！')}}catch(err){alert('无法读取备份，请选择本页面导出的 JSON 文件。')}e.target.value=''};
document.getElementById('campus').onerror=()=>document.getElementById('mapTip').textContent='地图图片未加载：请确认 pku-campus-map.jpg 与 index.html 在同一目录。';
draw();
</script>
</body></html>
